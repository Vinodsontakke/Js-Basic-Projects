<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="readData()">

  <div class="container">
    <div>

      <form class="create_form">
        Name:<input type="text" name="name" class="name">
        Email:<input type="email" name="email" class="email">
        <button type="button" onclick="create()">Save</button>
      </form>

      <form class="update_form">
        <input type="text" hidden class="id">
        Name: <input type="text" class="uname">
        Email:<input type="email" class="uemail">
        <button type="button" onclick="update()">Update</button>
      </form>

      <table>
        <thead>
          <th>Name</th>
          <th>Email</th>
          <th>Action</th>
        </thead>
        <tbody class="table_data">

        </tbody>
      </table>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
