<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>CRUD Operations</title>
</head>
<body onload="readAll()">
  <div class="container">
    <div class="form_container">

      <form class="create_form">
        Name:<input type="text" name="name" class="name">
        Email:<input type="email" name="email" class="email">
        <button type="button" onclick="addData()">Save</button>
      </form>
      
      <form class="update_form">
        <input type="number" name="id" hidden class="id">
        Name:<input type="text" name="uname" class="uname">
        Email:<input type="email" name="uemail" class="uemail">
        <button type="button" onclick="update()">Update</button>
      </form>

      <div class="add_div">
        <button type="button" onclick="create()">Add +</button>
      </div>
      <table>
        <thead>
          <th>Name</th>
          <th>Email</th>
          <th>Actions</th>
        </thead>
        <tbody class="table_data">

        </tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
